name: Refresh SHA256 checksums

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          files = [
              "CANONICAL_SPEC.md",
              "README.md",
              "behavior.md",
              "benchmark.md",
              "communication.md",
              "continuity.md",
              "manifest.json",
              "machine.json",
              "origin.md",
              "personality.md",
              "philosophy.md",
          ]

          sums = {}
          for name in files:
              data = Path(name).read_bytes()
              sums[name] = hashlib.sha256(data).hexdigest()

          Path("SHA256SUMS.json").write_text(
              json.dumps({"version": "1.0.1", "files": sums}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit checksum update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.json
          if git diff --cached --quiet; then
            echo "Checksums already current."
            exit 0
          fi
          git commit -m "Update SHA256 checksums for v1.0.1"
          git push
