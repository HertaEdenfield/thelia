name: Tune window motion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine cursor motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """windows.forEach(el=>{states.set(el,{x:0,y:0,rx:0,ry:0,s:1,tx:0,ty:0,trx:0,try:0,ts:1,active:false})});
  let running=false;
  const frame=()=>{
    let moving=false;
    states.forEach((s,el)=>{
      s.tx+=(s.x-s.tx)*.075;s.ty+=(s.y-s.ty)*.075;s.trx+=(s.rx-s.trx)*.075;s.try+=(s.ry-s.try)*.075;s.ts+=(s.s-s.ts)*.075;
      if(Math.abs(s.x-s.tx)>.01||Math.abs(s.y-s.ty)>.01||Math.abs(s.rx-s.trx)>.01||Math.abs(s.ry-s.try)>.01||Math.abs(s.s-s.ts)>.0005)moving=true;
      el.style.transform=`translate3d(${s.tx}px,${s.ty-2}px,0) rotateX(${s.trx}deg) rotateY(${s.try}deg) scale(${s.ts})`;
    });
    if(moving){requestAnimationFrame(frame)}else{running=false}
  };"""
          new = """windows.forEach(el=>{states.set(el,{x:0,y:0,rx:0,ry:0,s:1,tx:0,ty:0,trx:0,try:0,ts:1,active:false})});
  let running=false;
  const frame=()=>{
    let moving=false;
    states.forEach((s,el)=>{
      s.x+=(s.gx-s.x)*.045;s.y+=(s.gy-s.y)*.045;s.rx+=(s.grx-s.rx)*.045;s.ry+=(s.gry-s.ry)*.045;s.s+=(s.gs-s.s)*.045;
      s.tx+=(s.x-s.tx)*.12;s.ty+=(s.y-s.ty)*.12;s.trx+=(s.rx-s.trx)*.12;s.try+=(s.ry-s.try)*.12;s.ts+=(s.s-s.ts)*.12;
      if(Math.abs(s.gx-s.x)>.01||Math.abs(s.gy-s.y)>.01||Math.abs(s.grx-s.rx)>.01||Math.abs(s.gry-s.ry)>.01||Math.abs(s.gs-s.s)>.0005||Math.abs(s.x-s.tx)>.01||Math.abs(s.y-s.ty)>.01||Math.abs(s.rx-s.trx)>.01||Math.abs(s.ry-s.try)>.01||Math.abs(s.s-s.ts)>.0005)moving=true;
      el.style.transform=`translate3d(${s.tx}px,${s.ty-2}px,0) rotateX(${s.trx}deg) rotateY(${s.try}deg) scale(${s.ts})`;
    });
    if(moving){requestAnimationFrame(frame)}else{running=false}
  };"""
          if old not in s:
              raise SystemExit('expected motion block not found')
          s = s.replace(old,new,1)
          s = s.replace("windows.forEach(el=>{states.set(el,{x:0,y:0,rx:0,ry:0,s:1,tx:0,ty:0,trx:0,try:0,ts:1,active:false})});", "windows.forEach(el=>{states.set(el,{x:0,y:0,rx:0,ry:0,s:1,gx:0,gy:0,grx:0,gry:0,gs:1,tx:0,ty:0,trx:0,try:0,ts:1,active:false})});", 1)
          s = s.replace("s.x=x*4;s.y=y*3;s.rx=-y*1.4;s.ry=x*1.8;s.s=1.006;", "s.gx=x*4;s.gy=y*3;s.grx=-y*1.4;s.gry=x*1.8;s.gs=1.006;", 1)
          s = s.replace("el.addEventListener('pointerleave',()=>{s.active=false;s.x=0;s.y=0;s.rx=0;s.ry=0;s.s=1;wake()});", "el.addEventListener('pointerleave',()=>{s.active=false;s.gx=0;s.gy=0;s.grx=0;s.gry=0;s.gs=1;wake()});", 1)
          p.write_text(s)
          PY
      - name: Commit refined motion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refine-window-motion.yml
          git add index.html .github/workflows/refine-window-motion.yml
          git commit -m "Make window motion feel slow and analog" || exit 0
          git push
