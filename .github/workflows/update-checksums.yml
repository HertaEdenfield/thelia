name: Update canonical checksums
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SHA256SUMS.json
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = ['CANONICAL_SPEC.md','README.md','RECONSTRUCTION_PROTOCOL.md','behavior.md','benchmark.md','communication.md','continuity.md','manifest.json','machine.json','origin.md','personality.md','philosophy.md']
          data = {'version':'1.0.2','files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          Path('SHA256SUMS.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit checksum update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SHA256SUMS.json
          git diff --cached --quiet || git commit -m 'Update v1.0.2 canonical checksums'
          git push
